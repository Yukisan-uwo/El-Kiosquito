<title>El Kiosquito — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --brand-primary:#0F6E5C;
    --brand-primary-text:#0B5445;
    --brand-primary-soft:#E1F0EC;
    --brand-deep:#0B2E2A;
    --brand-accent:#E8871E;
    --surface-bg:#FAF6EE;
    --surface-card:#FFFFFF;
    --text-primary:#1F2B27;
    --text-secondary:#5C6B65;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--surface-bg);
    font-family:'Inter',sans-serif; color:var(--text-primary);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }

  /* --- paso 1: trazo del isotipo --- */
  /* Estado de reposo: la tarjeta y el formulario están completos y visibles
     desde el primer frame (sin JS, sin animación) — la cinemática de abajo
     es una mejora progresiva que solo se activa si el script corre y decide
     reproducirla, nunca la condición para ver el formulario. */
  .mark-stage{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    z-index:30; background:var(--surface-bg);
  }
  body.intro-play .mark-stage{
    display:flex;
    animation: mark-fade 0.35s ease 1.05s forwards;
  }
  @keyframes mark-fade{ to{ opacity:0; visibility:hidden; pointer-events:none; } }

  .mark{ width:96px; height:96px; }
  .mark path{
    fill:none; stroke:var(--brand-primary); stroke-width:5;
    stroke-linecap:round; stroke-linejoin:round;
  }
  body.intro-play .mark path{
    stroke-dasharray:340; stroke-dashoffset:340;
    animation: draw 0.6s cubic-bezier(0.4,0,0.2,1) forwards;
  }

  @keyframes draw{ to{ stroke-dashoffset:0; } }

  /* --- paso 2: barrido de degradé --- */
  .sweep{ display:none; }
  body.intro-play .sweep{
    display:block;
    position:fixed; inset:0; z-index:20; pointer-events:none;
    background:linear-gradient(120deg, var(--brand-primary) 0%, var(--brand-accent) 100%);
    opacity:0; animation: sweep-anim 0.3s ease 0.6s forwards;
  }
  @keyframes sweep-anim{
    0%{ opacity:0; clip-path: circle(0% at 0% 0%); }
    40%{ opacity:0.08; }
    100%{ opacity:0; clip-path: circle(150% at 100% 100%); }
  }

  /* --- paso 3: formulario --- */
  .card{
    position:relative; z-index:10;
    background:var(--surface-card); border-radius:16px;
    box-shadow:0 8px 24px rgba(11,46,42,0.12);
    width:380px; padding:40px 36px;
  }
  body.intro-play .card{
    opacity:0; transform:translateY(8px);
    animation: fade-up 0.25s cubic-bezier(0,0,0.2,1) forwards;
    animation-delay:0.9s;
  }
  body.intro-play .card > *{ opacity:0; transform:translateY(8px); animation: fade-up 0.25s cubic-bezier(0,0,0.2,1) forwards; }
  body.intro-play .card .logo-row{ animation-delay:0.95s; }
  body.intro-play .card h1{ animation-delay:1.0s; }
  body.intro-play .card .sub{ animation-delay:1.05s; }
  body.intro-play .card form{ animation-delay:1.1s; }
  body.intro-play .card .skip{ animation-delay:1.15s; }

  @keyframes fade-up{ to{ opacity:1; transform:translateY(0); } }

  .logo-row{ display:flex; align-items:center; gap:10px; margin-bottom:28px; }
  .logo-row .dot{ width:10px; height:10px; border-radius:999px; background:var(--brand-accent); }
  .logo-row span{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; letter-spacing:0.01em; color:var(--brand-deep); }

  h1{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 6px; color:var(--brand-deep); }
  .sub{ font-size:14px; color:var(--text-secondary); margin:0 0 28px; }

  label{ display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-secondary); margin-bottom:6px; }
  .field{ margin-bottom:18px; }
  input{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid #E4E0D6;
    background:#fff; font-size:15px; font-family:'Inter',sans-serif; color:var(--text-primary);
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input:focus{ border-color:var(--brand-primary); box-shadow:0 0 0 3px var(--brand-primary-soft); }

  button{
    width:100%; padding:12px; border:none; border-radius:12px;
    background:var(--brand-primary); color:#fff; font-size:15px; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer; margin-top:6px;
    transition:background .15s;
  }
  button:hover{ background:var(--brand-primary-text); }
  button:focus-visible{ outline:2px solid var(--brand-accent); outline-offset:2px; }

  .skip{
    display:none; text-align:center; margin-top:18px; font-size:12px; color:var(--text-secondary);
  }
  body.intro-play .skip{ display:block; }
  .skip button{
    all:unset; cursor:pointer; color:var(--brand-primary-text); font-weight:600; font-size:12px;
  }

  @media (prefers-reduced-motion: reduce){
    body.intro-play .mark-stage, body.intro-play .sweep{ display:none; }
    body.intro-play .card, body.intro-play .card > *{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>

<div class="mark-stage" id="markStage">
  <svg class="mark" viewBox="0 0 100 100">
    <path d="M20 75 L20 30 L50 15 L80 30 L80 75 M35 75 L35 50 L65 50 L65 75" />
  </svg>
</div>
<div class="sweep"></div>

<div class="card">
  <div class="logo-row"><div class="dot"></div><span>EL KIOSQUITO</span></div>
  <h1>Bienvenido de nuevo</h1>
  <p class="sub">Ingresá con tu cuenta para continuar</p>
  <form onsubmit="return false;">
    <div class="field">
      <label for="u">Usuario</label>
      <input id="u" type="email" placeholder="nombre@elkiosquito.ec" />
    </div>
    <div class="field">
      <label for="p">Contraseña</label>
      <input id="p" type="password" placeholder="••••••••" />
    </div>
    <button type="submit">Ingresar</button>
  </form>
  <div class="skip"><button id="skipBtn" type="button">Omitir animación de entrada</button></div>
</div>

<script>
  // Por defecto (sin JS, o si algo falla) la página ya muestra el formulario
  // completo — ver el bloque de CSS "estado de reposo". La cinemática es una
  // mejora progresiva: solo se activa si el script corre, es la primera vez
  // en esta sesión de navegador y el usuario no pidió menos movimiento.
  function stopIntro(){
    document.body.classList.remove('intro-play');
  }
  document.getElementById('skipBtn').addEventListener('click', stopIntro);
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape') stopIntro(); });

  try{
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var yaVista = sessionStorage.getItem('ek_intro_seen');
    if (!reduced && !yaVista){
      document.body.classList.add('intro-play');
      sessionStorage.setItem('ek_intro_seen', '1');
      // Salvaguarda: si por lo que sea la animación no llega a su fin
      // (pestaña en segundo plano, etc.), el formulario igual queda visible.
      setTimeout(stopIntro, 1800);
    }
  }catch(e){}
</script>
