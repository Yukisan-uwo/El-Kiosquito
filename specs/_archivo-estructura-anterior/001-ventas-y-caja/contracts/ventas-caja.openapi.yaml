openapi: 3.0.3
info:
  title: El Kiosquito — Ventas y Caja
  version: 1.0.0
  description: Contrato de la API del módulo 001-ventas-y-caja. Ver spec.md para requisitos y data-model.md para el esquema completo.
servers:
  - url: /api/v1
paths:
  /ventas:
    post:
      summary: Crear una venta (OO-VC01, OO-VC05)
      operationId: crearVenta
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [turno_caja_id, items, metodo_pago]
              properties:
                turno_caja_id: { type: integer }
                cliente_id: { type: integer, nullable: true }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [producto_id, cantidad_venta]
                    properties:
                      producto_id: { type: integer }
                      cantidad_venta: { type: number, format: decimal, minimum: 0.001 }
                metodo_pago: { type: string, enum: [efectivo, tarjeta, electronico] }
                descuento_aplicado: { type: number, format: decimal, default: 0 }
      responses:
        '201': { description: Venta creada, content: { application/json: { schema: { $ref: '#/components/schemas/Venta' } } } }
        '422': { description: 'Producto fraccionable sin factor_conversion configurado (RN-VC-001), u otro dato inválido' }
        '403': { description: 'turno_caja_id no pertenece a la sucursal del token (Art. 3.3)' }

  /ventas/{id}:
    get:
      summary: Consultar el detalle de una venta
      operationId: obtenerVenta
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Venta' } } } }
        '404': { description: No existe }

  /ventas/{id}/pago:
    patch:
      summary: Registrar el método de pago y su estado (OO-VC02)
      operationId: registrarPagoVenta
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado_pago]
              properties:
                estado_pago: { type: string, enum: [pendiente, aprobado, rechazado] }
      responses:
        '200': { description: Actualizado }

  /ventas/{id}/descuento:
    patch:
      summary: Aplicar un descuento/cupón a la venta en curso (OO-VC03)
      operationId: aplicarDescuentoVenta
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descuento_aplicado]
              properties:
                descuento_aplicado: { type: number, format: decimal, minimum: 0 }
      responses:
        '200': { description: Actualizado }
        '409': { description: 'La venta ya está completada/anulada, no admite descuento' }

  /ventas/{id}/anular:
    patch:
      summary: Anular o corregir una venta con motivo (OO-VC04)
      operationId: anularVenta
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo_anulacion]
              properties:
                motivo_anulacion: { type: string, minLength: 3 }
      responses:
        '200': { description: Venta anulada }
        '422': { description: 'motivo_anulacion ausente (RF-VC-004)' }

  /caja/turnos:
    post:
      summary: Abrir turno de caja con monto inicial (OO-VC06)
      operationId: abrirTurnoCaja
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto_inicial]
              properties:
                monto_inicial: { type: number, format: decimal, minimum: 0 }
      responses:
        '201': { description: Turno abierto, content: { application/json: { schema: { $ref: '#/components/schemas/TurnoCaja' } } } }
        '409': { description: 'El cajero ya tiene un turno abierto (índice único parcial de data-model.md)' }

  /caja/turnos/{id}:
    get:
      summary: Consultar el estado de un turno
      operationId: obtenerTurnoCaja
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TurnoCaja' } } } }

  /caja/turnos/{id}/cierre:
    patch:
      summary: Cerrar turno con monto contado; el sistema calcula la diferencia (OO-VC07)
      operationId: cerrarTurnoCaja
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto_contado]
              properties:
                monto_contado: { type: number, format: decimal, minimum: 0 }
      responses:
        '200': { description: 'Turno cerrado con monto_esperado y diferencia calculados', content: { application/json: { schema: { $ref: '#/components/schemas/TurnoCaja' } } } }
        '422': { description: 'monto_contado ausente (RF-VC-012)' }

  /caja/turnos/{id}/motivo-diferencia:
    patch:
      summary: Registrar el motivo de una diferencia de cuadre detectada (OO-VC08)
      operationId: registrarMotivoDiferencia
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo_diferencia]
              properties:
                motivo_diferencia: { type: string, minLength: 3 }
      responses:
        '200': { description: Actualizado }

  /demanda-insatisfecha:
    post:
      summary: Registrar un evento de demanda insatisfecha (OO-VC09)
      operationId: registrarDemandaInsatisfecha
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [producto_id, hora_evento]
              properties:
                producto_id: { type: integer }
                hora_evento: { type: string, format: date-time }
      responses:
        '201': { description: Registrado }

  /alertas-fraude-pago:
    post:
      summary: Registrar una alerta de posible fraude en un pago (OO-VC10)
      operationId: registrarAlertaFraudePago
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venta_id, motivo]
              properties:
                venta_id: { type: integer }
                motivo: { type: string, minLength: 3 }
                ultimos_4_digitos: { type: string, minLength: 4, maxLength: 4, nullable: true }
      responses:
        '201': { description: Alerta registrada }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Venta:
      type: object
      properties:
        id: { type: integer }
        sucursal_id: { type: integer }
        turno_caja_id: { type: integer }
        subtotal: { type: number }
        descuento_aplicado: { type: number }
        iva: { type: number }
        total: { type: number }
        metodo_pago: { type: string }
        estado_pago: { type: string }
        estado_venta: { type: string }
        detalle_venta:
          type: array
          items: { $ref: '#/components/schemas/DetalleVenta' }
    DetalleVenta:
      type: object
      properties:
        producto_id: { type: integer }
        cantidad_venta: { type: number }
        unidad_venta: { type: string }
        cantidad_inventario: { type: number }
        precio_unitario_aplicado: { type: number }
        subtotal_item: { type: number }
    TurnoCaja:
      type: object
      properties:
        id: { type: integer }
        sucursal_id: { type: integer }
        cajero_id: { type: integer }
        estado: { type: string }
        monto_inicial: { type: number }
        monto_contado: { type: number, nullable: true }
        monto_esperado: { type: number, nullable: true }
        diferencia: { type: number, nullable: true }
        motivo_diferencia: { type: string, nullable: true }
